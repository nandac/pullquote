standalone: true

filters:
  - type: lua
    path: pullquote.lua

variables:
  fontsize: 12pt
  mainfont: Noto Serif
  sansfont: Noto Sans
  monofont: Fira Mono
  codefont: Fira Mono
  linestretch: 1.25
  number-sections: true

metadata:
  author: Nandakumar Chandrasekhar
  # date is not set here; it's injected fresh on every build via the
  # Makefile's BUILD_DATE / --metadata=date:... flag.
