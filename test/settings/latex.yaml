to: latex
pdf-engine: lualatex

include-in-header:
  - _extensions/pullquote/pullquote.tex
  - test/assets/preview-styles.tex

variables:
  papersize: a4
  geometry:
    - margin=20mm
  monofontoptions:
    - Scale=0.97
  mathfont: STIX Two Math
  colorlinks: true
  linkcolor: blue
  urlcolor: blue
  citecolor: blue
